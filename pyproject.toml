[project]
name = "quantum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "faststream[cli,redis]>=0.7.5",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-qasm3-import>=0.6.0",
    "sqlmodel>=0.0.42",
    "tenacity>=9.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: mark test as an integration test.",
]
env_files = ["integration_tests/.env.test"]
